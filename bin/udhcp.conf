# setiing up the range of address for our network
start 10.42.0.10 #default: 192.168.0.20 
end 10.42.0.20 #default: 192.168.0.254

#the Interface to run the dhcp server on
interface wlan0 #default: eth0

# leave most of these as is
opt dns 8.8.8.8 1.1.1.1 
option subnet 255.255.255.0 
opt router xxx.xxx.xxx.xxx
option domain local 
option lease 864000 # 10 days of seconds
