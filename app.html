            const min_reducer = (accumulator, currentValue) => accumulator < currentValue ? accumulator : currentValue;
            const max_reducer = (accumulator, currentValue) => accumulator >= currentValue ? accumulator : currentValue;

            function min(numbers) {
                var m =  numbers.reduce(min_reducer);
                return m;
            }

            function max(numbers) {
                return numbers.reduce(max_reducer);
            }

            function avg(numbers) {
                return numbers.reduce((a, b) => (a + b)) / numbers.length;
            }

            function mode(numbers) {
                // as result can be bimodal or multi-modal,
                // the returned result is provided as an array
                // mode of [3, 5, 4, 4, 1, 1, 2, 3] = [1, 3, 4]
                var modes = [], count = [], i, number, maxIndex = 0;
             
                for (i = 0; i < numbers.length; i += 1) {
                    number = numbers[i];
                    count[number] = (count[number] || 0) + 1;
                    if (count[number] > maxIndex) {
                        maxIndex = count[number];
                    }
                }
             
                for (i in count)
                    if (count.hasOwnProperty(i)) {
                        if (count[i] === maxIndex) {
                            modes.push(Number(i));
                        }
                    }
             
                return modes.pop();
            }



            // helper function to get an element's exact position
            function getPosition(el) {
              var xPosition = 0;
              var yPosition = 0;
             
              while (el) {
                if (el.tagName == "BODY") {
                  // deal with browser quirks with body/window/document and page scroll
                  var xScrollPos = el.scrollLeft || document.documentElement.scrollLeft;
                  var yScrollPos = el.scrollTop || document.documentElement.scrollTop;
             
                  xPosition += (el.offsetLeft - xScrollPos + el.clientLeft);
                  yPosition += (el.offsetTop - yScrollPos + el.clientTop);
                } else {
                  xPosition += (el.offsetLeft - el.scrollLeft + el.clientLeft);
                  yPosition += (el.offsetTop - el.scrollTop + el.clientTop);
                }
             
                el = el.offsetParent;
              }
              return {
                x: xPosition,
                y: yPosition
              };
            }

            function load_depth() {
                window.FPS_CTR++;
                fetch("/get/value/"+window.CHITONX+"/"+window.CHITONY)
                    .then(response => response.json())
                    .then(data => { 
                        window.CHITON_SAMP = (window.CHITON_AVG) ?

                            data.value;
                        GBI("value").innerText = window.CHITON_SAMP.toFixed(0);
                        window.CHITON_WINDOW.push(data.value);
                        if (window.CHITON_WINDOW.length > window.CHITON_WINDOW_SZ) {
                            window.CHITON_WINDOW.shift();
                        }

                        GBI("min").innerText = min(window.CHITON_WINDOW);
                        GBI("max").innerText = max(window.CHITON_WINDOW);
                        GBI("avg").innerText = avg(window.CHITON_WINDOW).toFixed(0);
                        GBI("diff").innerText = max(window.CHITON_WINDOW) - min(window.CHITON_WINDOW) + ", " + data.stdd.toFixed(0);

                    }).catch((error) => { console.log("depth value net error!", error); window.CHITON_INTERVAL += 100; window.CHITON_INTERVAL = Math.min(window.CHITON_INTERVAL, 5000); });

                    window.setTimeout(load_depth, Math.max(window.CHITON_INTERVAL, 66));
                }

            function dlCanvas() {
                console.log("dl canvas");
                var canvas = GBI("canvas");
                var dt = canvas.toDataURL('image/png');
                //console.log("dt", dt);
                /* Change MIME type to trick the browser to download the file instead of displaying it */
                dt = dt.replace(/^data:image\/[^;]*/, 'data:application/octet-stream');
                //console.log("dt", dt);
                /* In addition to <a>'s "download" attribute, you can define HTTP-style headers */
                dt = dt.replace(/^data:application\/octet-stream/, 'data:application/octet-stream;headers=Content-Disposition%3A%20attachment%3B%20filename=image.png');
                console.log("dt", dt);
                this.href = dt;
                console.log("href set");
            };

            // Canvas Download
            function download(filename) {
              // create an "off-screen" anchor tag
              console.log("download", filename); 
             
              // create an "off-screen" anchor tag
              var lnk = document.createElement('a'), e;

              console.log("lnk", lnk); 
              // the key here is to set the download attribute of the a tag
              lnk.download = filename;

              // convert canvas content to data-uri for link. When download
              // attribute is set the content pointed to by link will be
              // pushed as "download" in HTML5 capable browsers
              lnk.href = GBI("canvas").toDataURL("image/png;base64");

              console.log("href", lnk); 
              // create a "fake" click-event to trigger the download
              if (document.createEvent) {
                e = document.createEvent("MouseEvents");
                e.initMouseEvent("click", true, true, window,
                                 0, 0, 0, 0, 0, false, false, false,
                                 false, 0, null);
                 console.log("dispatch", e); 
                  
                lnk.dispatchEvent(e);
              } else if (lnk.fireEvent) {
                lnk.fireEvent("onclick");
                console.log("fire", e); 
              }
            }

        <script>
            GBI("canvas").addEventListener("mousedown", canvas_down, false);
            GBI("canvas").addEventListener("mouseup", canvas_up, false);
            GBI("avg").addEventListener("click", avg_click, false);
            GBI("depth").addEventListener("click", depth_click, false);
            GBI("adical").addEventListener("click", adical_click, false);
            GBI("chitoncal").addEventListener("click", chitoncal_click, false);
            GBI("max_val").addEventListener("change", max_change, false);
            GBI("min_val").addEventListener("change", min_change, false);
            GBI("quality").addEventListener("change", quality_change, false);

            GBI("read_button").addEventListener("click", reg_read_status, false);
            GBI("write_button").addEventListener("click", reg_write_status, false);

            //GBI("gain").addEventListener("change", gain_change, false);
            //GBI("offset").addEventListener("change", offset_change, false);

            
            GBI("ss").addEventListener("change", ss_change, false);
            GBI("interval").addEventListener("change", interval_change, false);
            GBI("colormode").addEventListener("change", colormode_change, false);
            GBI("statstype").addEventListener("change", statstype_change, false);
            GBI("interval").value = window.CHITON_INTERVAL;

            var ctx = GBI("canvas").getContext("2d");
            var img = GBI("img");

            img.addEventListener("error", e => {
                console.log("error loading image data");
                window.CHITON_READY = true;
                
                window.CHITON_INTERVAL = Math.max(33, GBI("interval").value);
                window.setTimeout(load_data, window.CHITON_INTERVAL);
            });
            
            img.addEventListener("load", e => {
                var w = GBI("canvas").width;
                var h = GBI("canvas").height;
                ctx.drawImage(img, 0, 0, 640, 480, 0, 0, w, h);
                if (window.CHITON_R) {
                    chiton_line(ctx, window.CHITONX1, window.CHITONY1, window.CHITONX2, window.CHITONY1);
                    chiton_line(ctx, window.CHITONX2, window.CHITONY1, window.CHITONX2, window.CHITONY2);
                    chiton_line(ctx, window.CHITONX2, window.CHITONY2, window.CHITONX1, window.CHITONY2);
                    chiton_line(ctx, window.CHITONX1, window.CHITONY2, window.CHITONX1, window.CHITONY1);
                } else {
                    chiton_line(ctx, window.CHITONX, window.CHITONY-10, window.CHITONX, window.CHITONY+10);
                    chiton_line(ctx, window.CHITONX-10, window.CHITONY, window.CHITONX+10, window.CHITONY);
                }
                window.CHITON_READY = true;
                window.FPS_CTR++;

                
                window.CHITON_INTERVAL = Math.max(33, GBI("interval").value);
                window.setTimeout(load_data, window.CHITON_INTERVAL);
            });

            GBI("dwn_link").addEventListener("click", e => { download(GBI("filename").value); }, false);

            load_data();
            load_temp();
            load_depth();
            // load_snr();

            console.log("begin version 020");

        </script>
    </body>
</html>
