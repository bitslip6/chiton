<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <head>
        <script>
            window.CHITONX = 320;
            window.CHITONY = 240;
            window.CHITON_SAMP = 0;
            window.CHITON_AVG = true;
            window.CHITON_INTERVAL = 60;
            // helper function to get an element's exact position
            function getPosition(el) {
              var xPosition = 0;
              var yPosition = 0;
             
              while (el) {
                if (el.tagName == "BODY") {
                  // deal with browser quirks with body/window/document and page scroll
                  var xScrollPos = el.scrollLeft || document.documentElement.scrollLeft;
                  var yScrollPos = el.scrollTop || document.documentElement.scrollTop;
             
                  xPosition += (el.offsetLeft - xScrollPos + el.clientLeft);
                  yPosition += (el.offsetTop - yScrollPos + el.clientTop);
                } else {
                  xPosition += (el.offsetLeft - el.scrollLeft + el.clientLeft);
                  yPosition += (el.offsetTop - el.scrollTop + el.clientTop);
                }
             
                el = el.offsetParent;
              }
              return {
                x: xPosition,
                y: yPosition
              };
            }

            function img_click(event) {
                var p = getPosition(this);
                var x = event.clientX;
                var y = event.clientY;
                var imgx = x-p.x;
                var imgy = y-p.y;
                window.CHITONX=Math.floor(imgx * 0.8);
                window.CHITONY=Math.floor(imgy * 0.8);
            }

            function load_data() {
                window.FPS_CTR++;
                fetch("/get/value/"+window.CHITONX+"/"+window.CHITONY)
                    .then(response => response.json())
                    .then(data => { 
                        window.CHITON_SAMP = (window.CHITON_AVG) ? 
                            (0.7 * window.CHITON_SAMP) + (data.value * 0.3) :
                            data.value;
                        GBI("value").innerText = window.CHITON_SAMP.toFixed(0);
                    }).catch((error) => { console.log("net error!"); window.CHITON_INTERVAL += 100; window.CHITON_INTERVAL = Math.min(window.CHITON_INTERVAL, 5000); });
                GBI("img").src="/image/camera?" + new Date().getTime();
                window.setTimeout(load_data, window.CHITON_INTERVAL);
            }
            window.setInterval(() => {
                GBI("fps").innerText = window.FPS_CTR;
                window.FPS_CTR = 0;
            }, 1000);

            function GBI(name) { return document.getElementById(name); }
            function avg_click(e) {
                window.CHITON_AVG = !window.CHITON_AVG;
            }

            function depth_click(e) {
                var url = "/depth/setting/";
                console.log("depth click: ", url);
                console.log(GBI("depth").checked);
                url += (GBI("depth").checked) ? "depth" : "ir";
                console.log("url: ", url);
                fetch(url)
                    .then(response => response.json())
                    .then(data => { 
                        console.log("depth setting value: ", data);
                    });
            }

            function dlCanvas() {
                console.log("dl canvas");
                var canvas = GBI("canvas");
                var dt = canvas.toDataURL('image/png');
                //console.log("dt", dt);
                /* Change MIME type to trick the browser to download the file instead of displaying it */
                dt = dt.replace(/^data:image\/[^;]*/, 'data:application/octet-stream');
                //console.log("dt", dt);
                /* In addition to <a>'s "download" attribute, you can define HTTP-style headers */
                dt = dt.replace(/^data:application\/octet-stream/, 'data:application/octet-stream;headers=Content-Disposition%3A%20attachment%3B%20filename=image.png');
                console.log("dt", dt);
                this.href = dt;
                console.log("href set");
            };

            /* Canvas Download */
            function download(filename) {
              /// create an "off-screen" anchor tag
              console.log("download", filename); 
             
              /// create an "off-screen" anchor tag
              var lnk = document.createElement('a'), e;

              console.log("lnk", lnk); 
              /// the key here is to set the download attribute of the a tag
              lnk.download = filename;

              /// convert canvas content to data-uri for link. When download
              /// attribute is set the content pointed to by link will be
              /// pushed as "download" in HTML5 capable browsers
              lnk.href = GBI("canvas").toDataURL("image/png;base64");

              console.log("href", lnk); 
              /// create a "fake" click-event to trigger the download
              if (document.createEvent) {
                e = document.createEvent("MouseEvents");
                e.initMouseEvent("click", true, true, window,
                                 0, 0, 0, 0, 0, false, false, false,
                                 false, 0, null);
                 console.log("dispatch", e); 
                  
                lnk.dispatchEvent(e);
              } else if (lnk.fireEvent) {
                lnk.fireEvent("onclick");
                console.log("fire", e); 
              }
            }

            function max_change() {
                fetch("/max/setting/"+GBI("max").value)
                .then(response => response.json())
                .then(data => { 
                    console.log("max response", data);
                }).catch(e => { console.log("error setting mode: ", e); });
            }

            function interval_change() {
                window.CHITON_INTERVAL = Math.max(33, GBI("interval").value);
                console.log("set interval to: " + window.CHITON_INTERVAL + "ms");
            }
        
            function mode_change() {
                fetch("/mode/setting/"+GBI("mode").value)
                .then(response => response.json())
                .then(data => { 
                    console.log("color mode response", data);
                }).catch(e => { console.log("error setting mode: ", e); });
            }
        
            function colormode_change() {
                fetch("/colormode/setting/"+GBI("colormode").value)
                .then(response => response.json())
                .then(data => { 
                    console.log("color mode response", data);
                }).catch(e => { console.log("error setting color mode: ", e); });
            }

            function upgrade() {
                // console.log("upgrade");
                var rel = GBI("release").value;
                var u = GBI("upgrade");
                var base = u.getAttribute("data-href");
                // console.log("set href upgrade: ", base);
                u.setAttribute("href", base + rel + ".tar.gz");
                // console.log("href SET: ", (base+rel+".tar.gz"));

                fetch("/version/setting/"+rel)
                    .then(response => response.json())
                    .then(data => { 
                        console.log("version response", data);
                    }).catch(e => { console.log("error setting color mode: ", e); });
            }

        </script>

    <body>
        <canvas id="canvas" width="800" height="600"></canvas>
        <img src="/image/camera" id="img" style="display: none;">
        <br />
        <label style="float:left">Value: </label><h1 id="value">589</h1>
        <label>Average Samples:</label><input type="checkbox" id="avg" name="avg" checked="checked" />
        <label>IR:</label><input type="checkbox" id="depth" name="depth"  />
        <label>interval:</label><input type="text" id="interval" name="interval" value="60" />
        <label for="filename">Filename: </label><input id="filename" name="filename" type="text" value="image.png" />
        <br />
        <label for="max">Max Value: </label><input id="max" name="max" type="text" value="3500" />
        <a id="dwn_link" href="#">Download Image</a>
        <label for="fps">fps:</label><span id="fps">10</span>
        <label for="mode">mode:</label>
        <select name="mode" id="mode">
            <option value="near">near</option>
            <option value="medium">medium</option>
            <option value="far" selected="selected">far</option>
        </select>
        <select name="colormode" id="colormode">
            <option value="2" selected="selected">rainbow</option>
            <option value="1">greyscale</option>
        </select>
        <br />
        <!--// need to map these to download link https://github.com/bitslip6/chiton/archive/1.0.tar.gz -->
        <select name="release" id="release">
            <option value="1.0" selected="1.0">001</option>
            <option value="2.0">002</option>
        </select>
        <a href="#" id="upgrade" data-href="https://github.com/bitslip6/chiton/archive/">set version</a>

        <script>
            GBI("canvas").addEventListener("click", img_click, false);
            GBI("avg").addEventListener("click", avg_click, false);
            GBI("depth").addEventListener("click", depth_click, false);
            GBI("upgrade").addEventListener("click", upgrade, false);
            GBI("max").addEventListener("change", max_change, false);
            GBI("interval").addEventListener("change", interval_change, false);
            GBI("mode").addEventListener("change", mode_change, false);
            GBI("colormode").addEventListener("change", colormode_change, false);

            var ctx = GBI("canvas").getContext("2d");
            var img = GBI("img");
            img.addEventListener("load", e => {
                var w = GBI("canvas").width;
                ctx.drawImage(img, 0, 0, 640, 480, 0, 0, w, w*0.75);
            });

            GBI("dwn_link").addEventListener("click", e => {
               download(GBI("filename").value);
            }, false);

            load_data();
        </script>
    </body>
</html>
