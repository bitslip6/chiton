on:
  push:
    paths:
    - '**.c'
    - '**.cpp'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout chiton
      uses: actions/checkout@v2
      with:
        submodules: recursive
            
    - name: crosscompile
      run: ./devops/target_ubuntu1804_yocto25_arm64.sh