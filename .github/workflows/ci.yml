name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout (this repo - chiton)
      uses: actions/checkout@v2
      
    - name: Checkout (sources/glog)
      uses: actions/checkout@v2
      with:
        repository: google/glog
        path: glog  
        submodules: recursive
    - name: Checkout (sources/aditof)
      uses: actions/checkout@v2
      with:
        repository: murilopontes/aditof_sdk
        path: aditof_sdk
        submodules: recursive
        
    - name: build arm64
      run: docker run -v $PWD:/disney --workdir /disney murilopontes/ubuntu1604_yocto bash .github/workflows/ci.sh
       
