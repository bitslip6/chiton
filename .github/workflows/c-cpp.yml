name: chiton_ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout (this repo - chiton)
      uses: actions/checkout@v2
      
    - name: Checkout (sources/glog)
      uses: actions/checkout@v2
      with:
        repository: google/glog
        path: sources/glog  
        submodules: recursive
    - name: Checkout (sources/aditof)
      uses: actions/checkout@v2
      with:
        repository: murilopontes/aditof_sdk
        path: sources/aditof_sdk
        submodules: recursive
        
    - name: build arm64
      run: |
       docker run -v $PWD:/disney --workdir /disney murilopontes/ubuntu1604_yocto make
       
