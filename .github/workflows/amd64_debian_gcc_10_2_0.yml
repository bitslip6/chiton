on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout chiton
      uses: actions/checkout@v2
      with:
        submodules: recursive
      
    - name: Checkout glog
      uses: actions/checkout@v2
      with:
        repository: google/glog
        path: glog  
        submodules: recursive
    - name: Checkout aditof
      uses: actions/checkout@v2
      with:
        repository: murilopontes/aditof_sdk
        path: aditof_sdk
        submodules: recursive
        
    - name: build using gcc latest target - x86_64
      run: sh build-on-gcc-x86.sh
       
