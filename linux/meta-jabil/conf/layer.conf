# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	 ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "jabil"
BBFILE_PATTERN_jabil = "^${LAYERDIR}/"
BBFILE_PRIORITY_jabil = "5"
LAYERVERSION_jabil = "3"
LAYERSERIES_COMPAT_jabil = "poky sumo"
